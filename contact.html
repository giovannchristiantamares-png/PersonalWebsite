<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Giovann Christian B. Tamares</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-brown">
    <div class="container">
      <a class="navbar-brand" href="index.html">🥀</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="section-heading">Contact</h2>
    <div class="section-underline"></div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="panel">
          <form id="contactForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="contactName">Name</label>
              <input type="text" class="form-control form-control-brown" id="contactName" placeholder="Your name" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="contactEmail">Email</label>
              <input type="email" class="form-control form-control-brown" id="contactEmail" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="contactMessage">Message</label>
              <textarea class="form-control form-control-brown" id="contactMessage" rows="5" placeholder="Write your message..." required></textarea>
            </div>
            <button type="submit" class="btn btn-brown">Send Message</button>
            <div id="contactStatus" class="mt-3 fw-semibold" style="display:none;"></div>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="panel h-100">
          <h5 class="fw-bold mb-4">Reach Me Directly</h5>
          <p class="hero-line"><i class="bi bi-envelope-fill"></i> <a href="mailto:youremail@gmail.com" class="text-dark text-decoration-none">youremail@gmail.com</a></p>
          <p class="hero-line"><i class="bi bi-github"></i> <a href="https://github.com/yourusername" class="text-dark text-decoration-none" target="_blank" rel="noopener">github.com/yourusername</a></p>
          <p class="hero-line"><i class="bi bi-linkedin"></i> <a href="https://linkedin.com/in/yourusername" class="text-dark text-decoration-none" target="_blank" rel="noopener">linkedin.com/in/yourusername</a></p>
          <p class="hero-line"><i class="bi bi-geo-alt-fill"></i> Quezon City, Philippines</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-brown">
    <p class="mb-0">&copy; 2026 Giovann Christian B. Tamares. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
